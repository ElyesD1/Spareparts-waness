# GitHub Actions workflow for deploying NestJS backend to Azure
name: Deploy NestJS Backend to Azure

on:
  push:
    branches:
      - dev
    paths:
      - 'waness_auto/spare-parts-management-system_backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: waness_auto/spare-parts-management-system_backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: waness_auto/spare-parts-management-system_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Copy uploads directory
        run: |
          if [ -d "uploads" ]; then
            cp -r uploads dist/
          else
            mkdir -p dist/uploads
          fi

      - name: Create deployment package
        run: |
          cd ..
          mkdir -p deploy
          cp -r spare-parts-management-system_backend/dist deploy/
          cp -r spare-parts-management-system_backend/node_modules deploy/
          cp spare-parts-management-system_backend/package*.json deploy/
          cd deploy
          zip -r ../deployment.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'spare-parts-backend'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: waness_auto/deployment.zip

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Your API should be available at: https://spare-parts-backend.azurewebsites.net"
